<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#100e0c" />
<title>第4集《補習哥哥》分鏡表</title>
<style>
  :root {
    --bg: #100e0c;
    --bg2: #181512;
    --card: #1c1916;
    --card2: #231f1b;
    --line: rgba(232, 214, 190, 0.12);
    --line2: rgba(232, 214, 190, 0.22);
    --ink: #f6f0e8;
    --muted: #a3988c;
    --dim: #6f675e;
    --amber: #e3a56a;
    --amber2: #f0d3ae;
    --local: #8eb6c6;
    --ok: #9dC9ae;
    --warn: #e3a56a;
    --danger: #d9897a;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "PingFang HK", "PingFang TC", "Noto Sans CJK TC", "Heiti TC", sans-serif;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button, input, textarea, select { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { max-width: 520px; margin: 0 auto; padding-bottom: calc(92px + var(--safe-b)); }

  header.top {
    position: sticky; top: 0; z-index: 20;
    padding: calc(10px + var(--safe-t)) 16px 12px;
    background: linear-gradient(180deg, rgba(16,14,12,.96) 0%, rgba(16,14,12,.92) 70%, rgba(16,14,12,0) 100%);
    backdrop-filter: blur(16px);
  }
  .kicker {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    color: var(--dim); font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  }
  h1 {
    margin: 4px 0 2px; font-size: 28px; font-weight: 620; letter-spacing: -.03em; line-height: 1.05;
  }
  h1 span { color: var(--amber2); font-weight: 560; }
  .meta {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
  }
  .pill {
    border: 1px solid var(--line2); background: rgba(255,255,255,.03);
    color: var(--amber2); border-radius: 999px; padding: 4px 9px; font-size: 12px; letter-spacing: .02em;
  }
  .pill.ghost { color: var(--muted); }
  .clock {
    margin-top: 12px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end;
  }
  .total-num {
    font-variant-numeric: tabular-nums; font-size: 42px; line-height: .9; letter-spacing: -.04em; font-weight: 620;
  }
  .total-num em { font-style: normal; font-size: 16px; color: var(--muted); margin-left: 4px; font-weight: 500; }
  .total-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .total-sub.warn { color: var(--amber); }
  .total-sub.ok { color: var(--ok); }
  .bar {
    height: 3px; border-radius: 99px; background: #2a2622; margin-top: 10px; overflow: hidden;
  }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #b98552, #e3a56a); border-radius: 99px; }
  .locks { text-align: right; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .locks b { color: var(--ink); font-weight: 600; }

  .lockbox {
    margin: 4px 16px 8px; padding: 12px 12px 10px; border: 1px solid var(--line);
    background: var(--bg2); border-radius: 16px;
  }
  .lockbox h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .12em; color: var(--dim); font-weight: 600; }
  .who { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: start; margin-top: 8px; }
  .avatar {
    width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center;
    background: #2a241c; color: var(--amber2); font-size: 13px; font-weight: 650; letter-spacing: .04em;
  }
  .avatar.m { background: #1d2428; color: var(--local); }
  .who p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
  .who strong { color: var(--ink); font-weight: 620; }

  .list { padding: 8px 16px 0; display: flex; flex-direction: column; gap: 12px; }
  article.shot {
    background: linear-gradient(180deg, var(--card) 0%, var(--card2) 100%);
    border: 1px solid var(--line); border-radius: 20px; padding: 14px 14px 12px;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  article.shot::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--amber);
  }
  article.shot.local::before { background: var(--local); }
  article.shot.locked { border-color: rgba(157, 201, 174, .35); }
  .shot-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .sid {
    font-size: 22px; font-weight: 680; letter-spacing: -.03em; width: 92px;
    background: transparent; border: 0; padding: 0; outline: none;
  }
  .sid:focus { color: var(--amber2); }
  .head-right { display: flex; gap: 6px; align-items: center; }
  .sec {
    width: 62px; background: #12100e; border: 1px solid var(--line2); border-radius: 10px;
    padding: 6px 8px; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums;
  }
  .sec-label { color: var(--dim); font-size: 11px; margin-right: 2px; }
  .model {
    background: #12100e; border: 1px solid var(--line2); border-radius: 10px;
    padding: 6px 8px; font-size: 13px; min-width: 74px;
  }
  article.shot.local .model { color: var(--local); }
  article.shot:not(.local) .model { color: var(--amber2); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  label.field { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
  label.field span, .grid2 label span {
    font-size: 11px; letter-spacing: .12em; color: var(--dim); font-weight: 600;
  }
  textarea, .grid2 input {
    width: 100%; background: rgba(0,0,0,.22); border: 1px solid transparent;
    border-radius: 12px; padding: 9px 10px; font-size: 16px; line-height: 1.45; resize: none;
    outline: none;
  }
  textarea:focus, .grid2 input:focus, .sec:focus, .model:focus, .sid:focus {
    border-color: rgba(227, 165, 106, .55); background: rgba(0,0,0,.32);
  }
  .grid2 input { margin-top: 0; }
  .foot {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px;
  }
  .status {
    flex: 1; border: 1px solid var(--line2); background: #141210; border-radius: 12px;
    padding: 10px 12px; font-size: 14px; font-weight: 620; text-align: left;
    display: flex; justify-content: space-between; align-items: center;
  }
  .status i { font-style: normal; color: var(--dim); font-size: 11px; letter-spacing: .08em; font-weight: 600; }
  .status.s0 { color: var(--muted); }
  .status.s1 { color: var(--amber); border-color: rgba(227,165,106,.4); }
  .status.s2 { color: var(--ok); border-color: rgba(157,201,174,.4); }
  .del {
    border: 0; background: transparent; color: var(--dim); font-size: 13px; padding: 10px 8px;
  }
  .del.arm { color: var(--danger); }

  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 10px 16px calc(10px + var(--safe-b));
    background: linear-gradient(180deg, rgba(16,14,12,0), rgba(16,14,12,.94) 28%);
  }
  .dock-inner { max-width: 520px; margin: 0 auto; display: flex; gap: 8px; }
  .dock button, .tools button {
    border: 1px solid var(--line2); background: #221e1a; color: var(--ink);
    border-radius: 14px; padding: 12px 12px; font-size: 14px; font-weight: 620;
  }
  .dock .add { flex: 1.4; background: #e3a56a; color: #23180f; border-color: transparent; }
  .tools { display: flex; gap: 8px; padding: 14px 16px 0; }
  .tools button { flex: 1; background: transparent; color: var(--muted); font-weight: 560; }
  .note { color: var(--dim); font-size: 12px; line-height: 1.5; padding: 10px 18px 0; }
  .toast {
    position: fixed; left: 50%; bottom: calc(78px + var(--safe-b)); transform: translateX(-50%) translateY(8px);
    background: #f6f0e8; color: #1b1612; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 640;
    opacity: 0; pointer-events: none; transition: .2s ease; z-index: 40;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="kicker"><span>EP 04 · 直向分鏡</span><span>唔使登入</span></div>
    <h1>補習哥哥 <span>9:16</span></h1>
    <div class="meta">
      <span class="pill">約 35 秒</span>
      <span class="pill ghost">S1–S4 LTX</span>
      <span class="pill ghost">S5–S7 本地</span>
    </div>
    <div class="clock">
      <div>
        <div class="total-num" id="total">35<em>秒</em></div>
        <div class="total-sub" id="delta">對齊目標 35 秒</div>
      </div>
      <div class="locks" id="locks">英雄幀<br><b>0 / 7 已鎖定</b></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </header>

  <section class="lockbox">
    <h2>角色鎖 · 兩位都係 21–25 歲</h2>
    <div class="who">
      <div class="avatar">薇 23</div>
      <p><strong>小薇 · 23</strong><br>自然妝、高卷馬尾、C cup、無紋身、瘦、白皮有紋理。白襯衫解頂鈕，住宅暖燈。</p>
    </div>
    <div class="who">
      <div class="avatar m">哥 24</div>
      <p><strong>補習哥哥 · 24</strong><br>短髮、白襯衫袖捲起、瘦高、無紋身。夜歸，背包放低先坐埋去。</p>
    </div>
  </section>

  <div class="list" id="list"></div>

  <div class="tools">
    <button type="button" id="export">複製分鏡</button>
    <button type="button" id="json">下載 JSON</button>
    <button type="button" id="reset">恢復預填</button>
  </div>
  <p class="note">資料只寫喺這部手機嘅瀏覽器（localStorage）。用同一個檔案開先拎得返。清網站資料會冇咗。點英雄幀狀態會循環：未做 → 出圖中 → 已鎖定。</p>
</div>

<div class="dock">
  <div class="dock-inner">
    <button type="button" class="add" id="add">加鏡</button>
    <button type="button" id="top">回頂</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="application/json" id="defaults">[
  {"id":"s1","no":"S1","sec":5,"size":"中景","move":"緩推","visual":"夜，香港住宅客廳，暖黃檯燈。23歲小薇坐在木書枱前，白襯衫解頂鈕、高卷馬尾，筆記攤開。24歲補習哥哥推門進來，放下背包，走向她。9:16，手機實拍，皮膚有紋理。","line":"小薇：今晚溫邊章？\n哥哥：由你卡住嗰頁開始。","sfx":"門鎖、腳步、椅腳輕響","status":0,"model":"LTX"},
  {"id":"s2","no":"S2","sec":5,"size":"中近景","move":"固定微晃","visual":"兩人並肩坐低。哥哥指住筆記某一行，小薇側頭望佢，唔望紙。檯燈側光，書頁反光，背景書架虛化。","line":"哥哥：呢條你再講一次。\n小薇：你坐近咗。","sfx":"筆尖、紙聲","status":0,"model":"LTX"},
  {"id":"s3","no":"S3","sec":5,"size":"手部特寫","move":"緩推","visual":"哥哥隻手覆住小薇握筆嘅手。女手指微微收緊。白襯衫袖口、暖光、皮膚紋理清楚。鏡頭只見手、腕、筆記一角。","line":"哥哥：放鬆。唔係考試。","sfx":"衣料摩擦、輕呼吸","status":0,"model":"LTX"},
  {"id":"s4","no":"S4","sec":5,"size":"近景雙人","move":"輕搖","visual":"小薇轉過頭，兩人臉距好近，鼻尖幾乎碰到。她望住哥哥嘴巴，哥哥喉結動一下。暖側光，書牆虛化。9:16 上半身。","line":"小薇：我專心緊。\n哥哥：專心啲。","sfx":"時鐘、呼吸","status":0,"model":"LTX"},
  {"id":"s5","no":"S5","sec":5,"size":"特寫","move":"手持微推","visual":"本地出。哥哥托住小薇下頜吻落去。小薇手抓住佢襯衫前襟，馬尾鬆少少。暖燈打喺兩張面上，仍然 23 / 24 歲成年人。","line":"小薇（氣音）：哥哥……","sfx":"吻、衣料","status":0,"model":"本地"},
  {"id":"s6","no":"S6","sec":6,"size":"中近景","move":"緩降","visual":"本地出。小薇跨坐到哥哥大腿上，筆記滑到地上。裙擺上移，仍著內衫。哥哥手扣住她的腰，椅輕響。暖燈，住宅夜。","line":"哥哥：筆記先放低。\n小薇：聽日再抄。","sfx":"書本落地、椅吱、呼吸","status":0,"model":"本地"},
  {"id":"s7","no":"S7","sec":4,"size":"近景","move":"固定","visual":"本地出，英雄幀。小薇伏喺哥哥肩，襯衫略亂，筆記散在地上，暖燈。她側臉望向鏡頭，眼神未散。停喺呢格做封面。","line":"小薇：聽日再溫。","sfx":"環境靜、輕呼吸","status":0,"model":"本地"}
]</script>

<script>
const KEY = "ep4-tutor-storyboard-v1";
const STATUSES = ["未做", "出圖中", "已鎖定"];
const defaults = JSON.parse(document.getElementById("defaults").textContent);
const list = document.getElementById("list");
let shots = load();
let arm = null;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return structuredClone(defaults);
    const data = JSON.parse(raw);
    if (!Array.isArray(data) || !data.length) return structuredClone(defaults);
    return data;
  } catch (e) {
    return structuredClone(defaults);
  }
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(shots));
  renderTotals();
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("on"), 1400);
}
function renderTotals() {
  const sum = shots.reduce((n, s) => n + (Number(s.sec) || 0), 0);
  const locked = shots.filter(s => s.status === 2).length;
  document.getElementById("total").innerHTML = sum + "<em>秒</em>";
  const delta = document.getElementById("delta");
  const diff = sum - 35;
  delta.className = "total-sub" + (diff === 0 ? " ok" : " warn");
  delta.textContent = diff === 0 ? "對齊目標 35 秒" : (diff > 0 ? "長過目標 " + diff + " 秒" : "短過目標 " + Math.abs(diff) + " 秒");
  document.getElementById("locks").innerHTML = "英雄幀<br><b>" + locked + " / " + shots.length + " 已鎖定</b>";
  document.getElementById("bar").style.width = Math.min(100, (sum / 35) * 100) + "%";
}
function field(label, value, key, rows) {
  const lab = document.createElement("label");
  lab.className = "field";
  lab.innerHTML = "<span>" + label + "</span>";
  const ta = document.createElement("textarea");
  ta.rows = rows;
  ta.value = value || "";
  ta.addEventListener("input", () => {
    const shot = shots.find(s => s.id === lab.dataset.id);
    shot[key] = ta.value;
    ta.style.height = "auto";
    ta.style.height = ta.scrollHeight + "px";
    save();
  });
  lab.appendChild(ta);
  queueMicrotask(() => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; });
  return lab;
}
function render() {
  list.innerHTML = "";
  shots.forEach((shot, index) => {
    const card = document.createElement("article");
    card.className = "shot" + (shot.model === "LTX" ? "" : " local") + (shot.status === 2 ? " locked" : "");
    card.dataset.id = shot.id;

    const head = document.createElement("div");
    head.className = "shot-head";
    const no = document.createElement("input");
    no.className = "sid";
    no.value = shot.no;
    no.setAttribute("aria-label", "鏡號");
    no.addEventListener("input", () => { shot.no = no.value; save(); });

    const right = document.createElement("div");
    right.className = "head-right";
    const secWrap = document.createElement("label");
    secWrap.innerHTML = '<span class="sec-label">秒</span>';
    const sec = document.createElement("input");
    sec.className = "sec";
    sec.type = "number";
    sec.min = "1";
    sec.step = "1";
    sec.inputMode = "numeric";
    sec.value = shot.sec;
    sec.addEventListener("input", () => { shot.sec = Number(sec.value) || 0; save(); });
    secWrap.appendChild(sec);

    const model = document.createElement("input");
    model.className = "model";
    model.value = shot.model;
    model.setAttribute("list", "models");
    model.setAttribute("aria-label", "出片模型");
    model.addEventListener("input", () => {
      shot.model = model.value.trim() || "本地";
      card.classList.toggle("local", shot.model !== "LTX");
      save();
    });
    right.append(secWrap, model);
    head.append(no, right);

    const grid = document.createElement("div");
    grid.className = "grid2";
    [["景別", "size"], ["運鏡", "move"]].forEach(([label, key]) => {
      const lab = document.createElement("label");
      lab.innerHTML = "<span>" + label + "</span>";
      const input = document.createElement("input");
      input.value = shot[key] || "";
      input.addEventListener("input", () => { shot[key] = input.value; save(); });
      lab.appendChild(input);
      grid.appendChild(lab);
    });

    const visual = field("畫面", shot.visual, "visual", 4);
    const line = field("對白", shot.line, "line", 2);
    const sfx = field("音效", shot.sfx, "sfx", 2);
    [visual, line, sfx].forEach(el => el.dataset.id = shot.id);

    const foot = document.createElement("div");
    foot.className = "foot";
    const status = document.createElement("button");
    status.type = "button";
    status.className = "status s" + shot.status;
    status.innerHTML = "<i>英雄幀</i><span>" + STATUSES[shot.status] + "</span>";
    status.addEventListener("click", () => {
      shot.status = (shot.status + 1) % 3;
      save();
      render();
    });
    const del = document.createElement("button");
    del.type = "button";
    del.className = "del" + (arm === shot.id ? " arm" : "");
    del.textContent = arm === shot.id ? "確認刪" : "刪鏡";
    del.addEventListener("click", () => {
      if (arm !== shot.id) { arm = shot.id; render(); return; }
      shots = shots.filter(s => s.id !== shot.id);
      arm = null;
      save();
      render();
      toast("已刪 " + shot.no);
    });
    foot.append(status, del);
    card.append(head, grid, visual, line, sfx, foot);
    list.appendChild(card);
  });
  renderTotals();
}

document.getElementById("add").addEventListener("click", () => {
  const n = shots.length + 1;
  shots.push({
    id: "s" + Date.now(),
    no: "S" + n,
    sec: 4,
    size: "中近景",
    move: "固定",
    visual: "",
    line: "",
    sfx: "",
    status: 0,
    model: "本地"
  });
  arm = null;
  save();
  render();
  list.lastElementChild.scrollIntoView({ behavior: "smooth", block: "center" });
});
document.getElementById("top").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("恢復 S1–S7 預填？你改過嘅字會冇咗。")) return;
  shots = structuredClone(defaults);
  arm = null;
  save();
  render();
  toast("已恢復預填");
});
document.getElementById("export").addEventListener("click", async () => {
  const text = shots.map(s => [
    s.no + " · " + s.sec + "秒 · " + s.size + " · " + s.move + " · " + s.model + " · " + STATUSES[s.status],
    "畫面：" + (s.visual || "—"),
    "對白：" + (s.line || "—").replace(/\n/g, " / "),
    "音效：" + (s.sfx || "—")
  ].join("\n")).join("\n\n");
  const header = "第4集《補習哥哥》9:16 · 總 " + shots.reduce((n,s)=>n+(Number(s.sec)||0),0) + " 秒\n小薇23 / 補習哥哥24\n\n";
  try {
    await navigator.clipboard.writeText(header + text);
    toast("已複製分鏡");
  } catch (e) {
    toast("複製失敗，試下載 JSON");
  }
});
document.getElementById("json").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({ episode: "補習哥哥", ratio: "9:16", target: 35, shots }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ep4-tutor-storyboard.json";
  a.click();
  URL.revokeObjectURL(a.href);
});

const dl = document.createElement("datalist");
dl.id = "models";
["LTX", "本地", "Kling", "手動"].forEach(v => {
  const o = document.createElement("option");
  o.value = v;
  dl.appendChild(o);
});
document.body.appendChild(dl);
render();
</script>
</body>
